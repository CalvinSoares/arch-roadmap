<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Marca do DevAtlas: o globo do cabeçalho (círculo + meridiano) sobre o
    gradiente primary → glow-c. Cores fixas em vez de var(--…) porque o SVG é
    servido como arquivo, fora do documento que define os tokens.

    Traço em 3 (e não 2, como no cabeçalho): a favicon é vista a 16px, onde
    cada unidade do viewBox vale meio pixel — um traço de 2 renderizaria a 1px
    e sumiria contra o gradiente. O raio também é maior para o desenho ocupar
    a área toda em vez de virar um ponto no meio.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4482a" />
      <stop offset="1" stop-color="#c9a227" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#g)" />

  <g fill="none" stroke="#fff8f2" stroke-width="3" stroke-linecap="round">
    <!-- globo -->
    <circle cx="16" cy="16" r="9" />
    <!-- meridiano: a elipse estreita que dá a leitura de esfera -->
    <ellipse cx="16" cy="16" rx="4.4" ry="9" />
  </g>
</svg>
